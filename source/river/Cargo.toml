[package]
name          = "river"
version       = "0.5.0"

authors       = [
    "James Munns <james@onevariable.com>",
]
edition       = "2021"
readme        = "../../README.md"
repository    = "https://github.com/memorysafety/river"
description   = "A reverse proxy application, based on the pingora library from Cloudflare"
license       = "Apache-2.0"
categories    = [

]
keywords      = [
    "proxy",
]
documentation = "https://docs.rs/river/"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "doc_cfg"]

[dependencies]
async-trait = "0.1.79"
cidr = "0.2.3"
concread = "0.5.3"
futures-util = "0.3.30"
http = "1.0.0"
kdl = "4.6.0"
leaky-bucket = "1.1.2"
log = "0.4.21"
miette = { version = "5.10.0", features = ["fancy"] }
regex = "1.10.4"
thiserror = "1.0.61"
# NOTE: This used to rely on features other crates happened to enable. River
# uses `process` for the DNS-01 hook and `time` for the renewal timer, so those
# are now requested explicitly rather than by luck of feature unification.
tokio = { version = "1.37.0", features = ["process", "time", "macros", "sync"] }
toml = "0.8.12"
tracing = "0.1.40"

# File serving
#
# NOTE: River's file server was previously built on `static-files-module` from
# the pandora-web-server project. That project has been withdrawn - its
# repository no longer exists and its last crates.io release is pinned to
# Pingora 0.2 - so file serving is now built on `tower-http`'s `ServeDir`,
# which is adapted to Pingora's `ProxyHttp` interface in `src/files.rs`.

[dependencies.tower-http]
version  = "0.7.0"
features = ["fs"]

[dependencies.http-body-util]
version = "0.1.5"

[dependencies.bytes]
version = "1.12"

[dependencies.tracing-subscriber]
version  = "0.3.18"
features = [
    "fmt",
    "tracing-log",
]

[dependencies.clap]
version  = "4.5.4"
features = [
    "derive",
]

[dependencies.serde]
version  = "1.0.197"
features = [
    "derive"
]

# Pingora dependencies
#
# NOTE: As of Pingora 0.5, TLS is no longer enabled by default - each crate
# has an empty `default` feature set, and a TLS backend must be selected
# explicitly. We select `openssl`, which is the backend River has always
# used, so that `TlsSettings` remains available for TLS listeners.

# ACME (RFC 8555) client, used to obtain and renew TLS certificates.
#
# NOTE: This brings rustls into the binary alongside the OpenSSL that Pingora
# serves TLS with, because `instant-acme`'s HTTP client is hyper + rustls.
#
# The crypto backend is `aws-lc-rs`, which is `instant-acme`'s default and the
# provider rustls itself defaults to. The alternative, `ring`, is easier to
# cross compile, but adding a second crypto library to this project is not a
# decision to make for build convenience.
#
# BUILD REQUIREMENT: `aws-lc-rs` needs `cmake` (and a C compiler) at build time.
# This is a new requirement for building River, and the release builds need it
# available for every target in `workspace.metadata.dist`.
#
# Enabling exactly one crypto backend also lets rustls install its default
# provider from crate features, so River does not have to do it explicitly.
#
# If carrying a second TLS stack becomes a problem, `instant-acme` exposes an
# `HttpClient` trait, so the outbound client could be reimplemented on Pingora's
# own connector without touching any of the protocol logic. Note that a crypto
# backend would still be required, for signing ACME account requests.
[dependencies.instant-acme]
version          = "0.8.5"
default-features = false
features         = ["hyper-rustls", "aws-lc-rs"]

# Used for the ACME account credentials and certificate metadata on disk
[dependencies.serde_json]
version = "1.0"

# Used for `flock` on the ACME store directory. Already in the dependency tree,
# so depending on it directly costs nothing.
[dependencies.libc]
version = "0.2"

# River works with OpenSSL types directly in `src/tls/backend.rs`, to parse
# certificates and install them into an in-progress handshake.
#
# NOTE: `pingora-core` re-exports a handful of `openssl` modules as
# `pingora_core::tls`, but not all of the ones we need (`asn1`, `ec`, ...), so we
# depend on `openssl` directly as well. The version requirement matches the one
# `pingora-openssl` uses, so Cargo resolves both to a single crate - it is
# important that these do not end up as two versions, or the types will not be
# interchangeable.
[dependencies.openssl]
version = "0.10.72"

# DNS-based upstream service discovery, for A/AAAA and SRV records.
#
# Pingora resolves upstream addresses through `std`'s blocking `ToSocketAddrs`,
# which gives neither SRV records nor the TTL of an answer. River needs both:
# the TTL is what "River MUST support the use of DNS TTL as timeout value for
# re-polling" asks for.
#
# NOTE: default features are off on purpose. `tokio` and `system-config` are
# all River uses; everything else this crate offers is either an encrypted DNS
# transport (DoT, DoH, DoQ) or DNSSEC, each of which would pull in a crypto
# backend. Keeping them off means this dependency adds no C toolchain
# requirement to the build, unlike the ACME client's.
[dependencies.hickory-resolver]
version          = "0.26"
default-features = false
features         = ["tokio", "system-config"]

[dependencies.pingora]
version  = "0.8.1"
features = ["openssl"]

[dependencies.pingora-core]
version  = "0.8.1"
features = ["openssl"]

[dependencies.pingora-proxy]
version  = "0.8.1"
features = ["openssl"]

[dependencies.pingora-http]
version = "0.8.1"

[dependencies.pingora-load-balancing]
version  = "0.8.1"
features = ["openssl"]

[dev-dependencies]

# Runs a nameserver in-process, so that the discovery tests can serve a zone
# they control and then change it. Without this the only coverage of the
# `hickory` adapter would be a hand-written fake, which cannot tell us whether
# real records and real TTLs are read correctly.
#
# NOTE: No test may query a name that resolves on the public internet - the
# suite has to pass on a machine with no network.
hickory-server = { version = "0.26", default-features = false }
