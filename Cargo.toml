[workspace]
resolver = "2"
members = [
    "source/river",
]

# Config for 'cargo dist'
[workspace.metadata.dist]
# The preferred cargo-dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.13.2"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Publish jobs to run in CI
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false

# System packages needed to build River.
#
# `aws-lc-rs`, the crypto backend behind River's ACME client, builds C code via
# `aws-lc-sys`, so `cmake` and a C toolchain must be present. The GitHub runners
# already ship `cmake`, but declaring it means a build does not silently depend
# on that staying true. `musl-tools` provides the `musl-gcc` wrapper that
# `aws-lc-sys` needs for the musl target.
#
# NOTE: The musl build is the one most likely to need attention here - it is a
# cross build of a C library, and has not been exercised outside CI.
[workspace.metadata.dist.dependencies.apt]
cmake = '*'
musl-tools = { version = '*', targets = ["x86_64-unknown-linux-musl"] }

[workspace.metadata.dist.dependencies.homebrew]
cmake = '*'

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# NOTE: River previously patched the `pingora-*` crates to a fork
# (memorysafety/pingora, branch `james/bonus-data-v2`) which added a `Metadata`
# type parameter to `LoadBalancer`, so that an `HttpPeer` could be attached to
# each backend. Upstream Pingora has since grown `Backend::ext` (an
# `http::Extensions`) which serves the same purpose, and River's proxy already
# uses it, so the fork is no longer needed and we track crates.io releases.
